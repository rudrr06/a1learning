    if (!st.send) return;
    function pos(id) { var n = nodes[id]; return { x: n.x / 100 * stage.clientWidth, y: n.y / 100 * stage.clientHeight }; }
    function fly(sp) {
      var path = sp.path || [sp.f, sp.t], pts = path.map(pos), per = sp.ms || 800;
      if (sp.x) { var q = sp.stop === undefined ? 0.85 : sp.stop, last = pts[pts.length - 1], prev = pts[pts.length - 2]; pts[pts.length - 1] = { x: prev.x + (last.x - prev.x) * q, y: prev.y + (last.y - prev.y) * q }; }
      var d = document.createElement("div");
      d.className = "gpkt " + (sp.c || "hot"); d.innerHTML = sp.label || "";
      d.style.left = pts[0].x + "px"; d.style.top = pts[0].y + "px";
      stage.appendChild(d); playing.push(d);
      var kf = pts.map(function (p, k) { return { left: p.x + "px", top: p.y + "px", offset: k / (pts.length - 1) }; });
      var a = d.animate(kf, { duration: per * (pts.length - 1), easing: pts.length > 2 ? "linear" : "ease-in-out", fill: "forwards" });
      a.onfinish = function () { if (sp.x) { d.className = "gpkt bad"; d.innerHTML = "✕ blocked"; timers.push(setTimeout(function () { d.remove(); }, 1200)); } else d.remove(); };
    }
    st.send.forEach(function (sp) { if (sp.delay) timers.push(setTimeout(function () { fly(sp); }, sp.delay)); else fly(sp); });
  }

  function clearAll() {
    timers.forEach(clearTimeout); timers = [];
    playing.forEach(function (p) { p.remove(); }); playing = [];
    if (synth) synth.cancel();
  }

  var seed = 7;
  function shuf(a) { var r = a.slice(), i, j, t; for (i = r.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; j = Math.floor(seed / 233280 * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; } return r; }

  /* ---------- build cards ---------- */
  DATA.forEach(function (t, ti) {
    var first = cards.length, total = t.steps.length + 1 + Math.min(2, t.quiz.length);
    function add(kind, extra) { var c = { kind: kind, t: t, ti: ti, idx: cards.length - first, total: total }; for (var k in extra) c[k] = extra[k]; cards.push(c); }
    add("intro", {});
    t.steps.forEach(function (st, i) { add("step", { step: st, i: i }); });
    t.quiz.slice(0, 2).forEach(function (q, qi) { add("quiz", { q: q, qi: qi }); });
    cards.slice(first).forEach(function (c) { c.total = cards.length - first; c.first = first; });
  });

  cards.forEach(function (c, n) {
    var el = document.createElement("section"), t = c.t, h = "";
    el.className = "reel " + c.kind; el.setAttribute("data-n", n);
    if (c.kind === "intro") {
      h = '<div class="rbig">' + t.icon + '</div><div class="rtag">' + t.tag + '</div><h2>' + t.title + '</h2><p class="rsub">' + t.blurb + '</p><div class="rswipe">↑<small>swipe up</small></div>';
    } else if (c.kind === "step") {
      c.stage = buildStage(t, c.i);
      h = '<div class="rchip">' + t.icon + ' ' + t.title + ' · ' + (c.i + 1) + '/' + t.steps.length + '</div><div class="rpanel"></div><p class="cap">' + c.step.msg + '</p>' + (c.step.info ? '<div class="rinfo">💡 ' + c.step.info + '</div>' : '');
    } else {
      var opts = shuf(c.q.o);
      h = '<div class="rchip">' + t.icon + ' Quick check</div><h3 class="qq">' + c.q.q + '</h3><div class="qo">' + opts.map(function (o) { return '<button data-r="' + (o === c.q.o[0] ? 1 : 0) + '">' + o + '</button>'; }).join("") + '</div><div class="qe"></div>';
    }
    el.innerHTML = h;
    if (c.kind === "step") el.querySelector(".rpanel").appendChild(c.stage.el);
    if (c.kind === "quiz") {
      var done = false, qe = el.querySelector(".qe");
      Array.prototype.forEach.call(el.querySelectorAll("button"), function (b) {
        b.onclick = function () {
          if (done) return; done = true;
          var ok = b.getAttribute("data-r") === "1";
          Array.prototype.forEach.call(el.querySelectorAll("button"), function (x) { x.disabled = true; if (x.getAttribute("data-r") === "1") x.className = "right"; });
          if (!ok) b.className = "wrong";
          qe.innerHTML = (ok ? "<b>Correct!</b> " : "<b>Not quite.</b> ") + c.q.e;
          speak((ok ? "Correct. " : "Not quite. ") + c.q.e, false);
        };
      });
    }
    c.el = el; feed.appendChild(el);
  });

  /* ---------- narration ---------- */
  function speak(text, advance) {
    if (!started) return;
    if (sound && synth) {
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      u.rate = 0.97;
      var fired = false, myCur = cur;
      function end() { if (fired || myCur !== cur) return; fired = true; if (advance && auto) timers.push(setTimeout(next, 900)); }
      u.onend = end; u.onerror = end;
      synth.speak(u);
      timers.push(setTimeout(end, Math.max(6000, text.length * 95)));
    } else if (advance && auto) {
      timers.push(setTimeout(next, Math.max(4000, text.length * 55)));
    }
  }

  function activate(n) {
    if (n === cur) return;
    clearAll(); cur = n;
    var c = cards[n];
    updateBar(c);
    if (!started) return;
    run(c);
  }
  function run(c) {
    if (c.kind === "step") { play(c); speak(strip(c.step.msg), true); }
    else if (c.kind === "intro") speak(c.t.title + ". " + strip(c.t.blurb), true);
    else speak(c.q.q, false);
  }
  function next() { if (cur < cards.length - 1) cards[cur + 1].el.scrollIntoView({ behavior: "smooth" }); }
  function prev() { if (cur > 0) cards[cur - 1].el.scrollIntoView({ behavior: "smooth" }); }
  function jumpTopic(d) {
    var c = cards[cur], ti = c.ti + d;
    if (ti < 0 || ti >= DATA.length) return;
    var f = cards.filter(function (x) { return x.ti === ti; })[0];
    f.el.scrollIntoView({ behavior: "smooth" });
  }

  var barEl = document.getElementById("bar");
  function updateBar(c) {
    var i, h = "", tc = cards.filter(function (x) { return x.ti === c.ti; });
    for (i = 0; i < tc.length; i++) h += '<i class="' + (i <= c.idx ? "on" : "") + '"></i>';
    barEl.innerHTML = h;
  }

  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio >= 0.6) activate(+e.target.getAttribute("data-n")); });
  }, { root: feed, threshold: [0.6] });
  cards.forEach(function (c) { io.observe(c.el); });

  /* ---------- controls ---------- */
  var bs = document.getElementById("bSound"), ba = document.getElementById("bAuto"), go = document.getElementById("go");
  bs.onclick = function () { sound = !sound; bs.textContent = sound ? "🔊" : "🔇"; if (!sound && synth) synth.cancel(); else if (started) { clearAll(); run(cards[cur]); } };
  ba.onclick = function () { auto = !auto; ba.className = auto ? "on" : ""; ba.textContent = auto ? "▶ Auto" : "⏸ Manual"; };
  go.onclick = function () {
    started = true; document.getElementById("start").style.display = "none";
    if (synth) { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); }
    run(cards[Math.max(cur, 0)]);
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); next(); } else if (e.key === "ArrowUp") { e.preventDefault(); prev(); }
    else if (e.key === "ArrowRight") jumpTopic(1); else if (e.key === "ArrowLeft") jumpTopic(-1);
  });
  var sx = 0, sy = 0;
  feed.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  feed.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) jumpTopic(dx < 0 ? 1 : -1);
  }, { passive: true });
  window.addEventListener("pagehide", function () { if (synth) synth.cancel(); });
  activate(0);
})();

</script>
</body></html>
